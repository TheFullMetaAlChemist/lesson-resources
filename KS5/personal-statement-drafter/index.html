<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A guided personal statement workshop. Gather ideas, develop your own writing and export a draft for the three UCAS questions.">
  <meta name="theme-color" content="#21314d">
  <meta name="referrer" content="no-referrer">
  <title>Personal Statement Workshop | Sidcot Staff Tools</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%2321314d'/%3E%3Cpath d='M12 11h16v18H12z' fill='none' stroke='%23f6a800' stroke-width='2'/%3E%3Cpath d='M16 17h8m-8 5h6' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css?v=1.0.0">
  <!-- Keep this order. No build tools, external fonts or online libraries are needed. -->
  <script src="./prompts.js?v=1.0.0" defer></script>
  <script src="./exports.js?v=1.0.0" defer></script>
  <script src="./app.js?v=1.0.0" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to the writing area</a>
  <header class="site-header">
    <div class="header-inner">
      <button class="brand" type="button" data-action="home" aria-label="Personal Statement Workshop home">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M8 5h13l4 4v18H8zM20 5v6h5M12 15h9M12 20h7"/></svg></span>
        <span><span class="brand-kicker">SIDCOT STAFF TOOLS</span><span class="brand-name">Personal Statement Workshop</span></span>
      </button>
      <div class="header-actions">
        <button class="button ghost small" type="button" data-action="help">Help</button>
        <button class="button secondary small" type="button" data-action="open">Open work</button>
        <button class="button primary small" type="button" data-action="save" id="header-save">Save progress <span aria-hidden="true">↓</span></button>
      </div>
    </div>
  </header>
  <div id="storage-strip" class="storage-strip" hidden></div>
  <div id="app" class="app-shell">
    <main id="main" tabindex="-1"><p class="loading">Opening your writing workspace…</p></main>
  </div>
  <footer class="site-footer">
    <span>A starting point, not a finished statement. Your experiences. Your words.</span>
    <span><a href="https://www.ucas.com/applying/applying-to-university/writing-your-personal-statement/how-to-write-your-personal-statement-for-2026-entry-onwards" target="_blank" rel="noopener noreferrer">UCAS guidance <span class="sr-only">(opens a new tab)</span><span aria-hidden="true">↗</span></a> · <button type="button" class="text-button" data-action="privacy">Privacy &amp; saving</button> · v1.0</span>
  </footer>
  <input id="open-file" type="file" accept=".json,application/json" hidden>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
  <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <!-- Print only the prepared document, never the application controls. -->
  <section id="print-root" aria-label="Printable draft"></section>
  <noscript><div class="noscript">This workshop needs JavaScript to run. Enable JavaScript, then reload this page. The tool does not need an account.</div></noscript>
</body>
</html>
